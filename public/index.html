<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikrotikAssistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/design-system.css">
  <!-- Google Fonts for Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inline Script to prevent Theme Flash -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('mikrotik-assistant-theme');
      if (!savedTheme) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          savedTheme = 'light';
        } else {
          savedTheme = 'dark';
        }
      }
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    })();
  </script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden">
  <div id="app" class="flex flex-col h-full">
    <!-- Header component container -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar component container -->
      <div id="sidebar-container" class="flex flex-col"></div>

      <!-- Main Content Area -->
      <main id="main-content" class="flex-1 overflow-y-auto p-6">
        <!-- Content injected by router.js -->
      </main>
    </div>
  </div>

  <!-- External dependencies and pure utilities -->
  <script src="/vendor/diff/diff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="/js/utils.js"></script>

  <script src="/js/state.js"></script>
  <script src="/js/ui/icons.js"></script>
  <script src="/js/builder/diff-viewer.js"></script>
  <script src="/js/builder/engine.js"></script>
  <script src="/js/builder/library.js"></script>
  <script src="/js/builder/monaco-integration.js"></script>
  <script src="/js/builder/drag-drop.js"></script>
  <!-- Shared UI Components -->
  <script src="/js/components/ui/icons.js"></script>
  <script src="/js/components/ui/buttons.js"></script>
  <script src="/js/components/ui/cards.js"></script>
  <script src="/js/components/ui/inputs.js"></script>
  <script src="/js/components/ui/modals.js"></script>
  <script src="/js/components/ui/collapsible.js"></script>
  <script src="/js/components/ui/prompt-modal.js"></script>

  <script src="/js/router.js"></script>
  <script src="/js/components/header.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/audit-tab.js"></script>
  <script src="/js/components/build-tab.js"></script>
  <script src="/js/components/lib-tab.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
